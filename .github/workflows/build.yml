name: Android Build
on:
  workflow_dispatch:
    # push:
    #     branches:
    #         - 'main'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ---- 替换 Android SDK 源：指向腾讯云镜像，避开 dl.google.com ----
      - name: Use Tencent mirror for Android SDK
        run: |
          mkdir -p ~/.android
          # sdkmanager 会读取此文件，把 SDK 包（platforms/build-tools/NDK 等）改从腾讯云拉取
          echo "https://mirrors.cloud.tencent.com/AndroidSDK/repository2-1.xml" > ~/.android/repositories.cfg

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install imagemagick
          convert --version

      # ---- Gradle / pnpm 国内镜像（阿里云 + 腾讯云 + npmmirror）----
      - name: Configure domestic mirrors
        run: |
          # 1) Gradle 依赖与插件：阿里云镜像（兼容 dependencyResolutionManagement 模式）
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          settingsEvaluated { settings ->
              if (settings.pluginManagement) {
                  settings.pluginManagement {
                      repositories {
                          maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
                          gradlePluginPortal()
                          google()
                          mavenCentral()
                      }
                  }
              }
              if (settings.dependencyResolutionManagement) {
                  settings.dependencyResolutionManagement {
                      repositories {
                          maven { url 'https://maven.aliyun.com/repository/public/' }
                          maven { url 'https://maven.aliyun.com/repository/google/' }
                          maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
                          google()
                          mavenCentral()
                      }
                  }
              }
          }
          EOF

          # 2) Gradle 发行包本身：腾讯云镜像（仅替换域名，保留项目原版本号）
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#services\.grad\.org/distributions#mirrors.cloud.tencent.com/gradle#g' gradle/wrapper/gradle-wrapper.properties
          fi

          # 3) pnpm 国内镜像（避免 npm 官方源超时）
          pnpm config set registry https://registry.npmmirror.com

          pnpm install
          pnpm pp:worker

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: '${{ env.NAME }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ env.NAME }}
          VERSION: ${{ env.VERSION }}
          PUBBODY: ${{ env.PUBBODY }}
