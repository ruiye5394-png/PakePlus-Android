name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

# 应用信息。原来 NAME/VERSION 写成自己引用自己（NAME: ${{ env.NAME }}），结果是空值，
# 导致 APK 文件名和 Release tag 都是空的，这里改成真实值。
env:
  APP_NAME: xiaocui-ledger
  APP_VERSION: 1.0.0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ================================================================
      # 【关键修复】这里删掉了 android-actions/setup-android@v3
      #
      # 原因：该 action 会检查 SDK 里有没有 cmdline-tools 16.0(构建号 12266719)，
      # 运行器预装的只有 12.0，所以它每次都去 dl.google.com 下载 ->
      # 国内网络超时/被墙 -> "Set up Android SDK" 步骤直接红。
      # 它的下载地址写死在 action 内部，repositories.cfg 镜像对它无效。
      #
      # ubuntu-latest 本来就自带完整 Android SDK，直接用即可，零 Google 请求：
      #   build-tools 34.0.0 / 35.0.0 / 35.0.1 / 36.0.0
      #   platforms   android-34 / android-35 / android-36
      #   NDK         27.3.13750724 / 28.2.13676358 / 29.0.14206865
      #   JDK         17（默认）
      # ================================================================
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME     = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME = $ANDROID_NDK_HOME"
          echo "JAVA_HOME        = $JAVA_HOME"
          echo "--- build-tools ---";  ls "$ANDROID_SDK_ROOT/build-tools"   2>/dev/null || true
          echo "--- platforms -----";  ls "$ANDROID_SDK_ROOT/platforms"     2>/dev/null || true
          echo "--- ndk -----------";  ls "$ANDROID_SDK_ROOT/ndk"           2>/dev/null || true
          echo "--- cmdline-tools -";  ls "$ANDROID_SDK_ROOT/cmdline-tools" 2>/dev/null || true

      - name: Configure Tencent mirror for Android SDK
        run: |
          mkdir -p ~/.android
          # sdkmanager 会读这个文件，后续补装 SDK 包（platforms/build-tools/NDK）都走腾讯云
          echo "https://mirrors.cloud.tencent.com/AndroidSDK/repository2-1.xml" > ~/.android/repositories.cfg
          # 预接受 license，避免 sdkmanager 交互卡住（运行器通常已接受，失败也不影响构建）
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
          echo ">> Android SDK 源已指向腾讯云镜像"

      - name: Configure Aliyun Maven mirrors for Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE_INIT_EOF'
          settingsEvaluated { settings ->
              if (settings.pluginManagement) {
                  settings.pluginManagement {
                      repositories {
                          maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
                          maven { url 'https://maven.aliyun.com/repository/google/' }
                          maven { url 'https://maven.aliyun.com/repository/public/' }
                          gradlePluginPortal()
                          google()
                          mavenCentral()
                      }
                  }
              }
              if (settings.dependencyResolutionManagement) {
                  settings.dependencyResolutionManagement {
                      repositories {
                          maven { url 'https://maven.aliyun.com/repository/google/' }
                          maven { url 'https://maven.aliyun.com/repository/public/' }
                          maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
                          google()
                          mavenCentral()
                      }
                  }
              }
          }
          GRADLE_INIT_EOF
          echo ">> Gradle 依赖/插件源已注入阿里云镜像（用 settingsEvaluated，兼容 FAIL_ON_PROJECT_REPOS）"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Init Project Config
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm install
          pnpm pp:worker

      # Gradle 发行包换成腾讯云镜像（只换域名，保留项目原定版本号）
      # 注意：必须放在 pp:worker 之后，包装器文件是它生成的
      - name: Patch Gradle wrapper to Tencent mirror
        run: |
          F="$(find . -name gradle-wrapper.properties -print -quit)"
          if [ -n "$F" ]; then
            echo ">> wrapper: $F"
            sed -i 's#services\.gradle\.org/distributions#mirrors.cloud.tencent.com/gradle#g' "$F" || true
            grep distributionUrl "$F" || true
          else
            echo ">> 未找到 gradle-wrapper.properties，跳过"
          fi

      # 项目若要求某个未预装的 NDK 版本：先从腾讯云镜像装；装不到就软链到已装版本，
      # 避免 Gradle 自己跑去 dl.google.com 下载。
      - name: Ensure project-required NDK exists
        run: |
          set +e
          REQ="$(grep -rhoE '(ndkVersion|android\.ndkVersion)[[:space:]]*=?[[:space:]]*\"?[0-9]+\.[0-9]+\.[0-9]+' . 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo ">> 项目要求的 NDK 版本: ${REQ:-<未指定>}"
          if [ -z "$REQ" ]; then echo ">> 未指定 ndkVersion，跳过"; exit 0; fi
          if [ -d "$ANDROID_SDK_ROOT/ndk/$REQ" ]; then echo ">> NDK $REQ 已预装"; exit 0; fi
          echo ">> NDK $REQ 缺失，尝试从腾讯云镜像安装"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "ndk;$REQ" > /tmp/ndk.log 2>&1
          if [ $? -eq 0 ]; then
            echo ">> 已从镜像安装 NDK $REQ"
          else
            FB="$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | head -1)"
            echo ">> 镜像安装失败，软链 $FB -> $REQ"
            tail -n 20 /tmp/ndk.log 2>/dev/null || true
            ln -sfn "$ANDROID_SDK_ROOT/ndk/$FB" "$ANDROID_SDK_ROOT/ndk/$REQ"
          fi
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          ls -la
          mv app-debug.apk "${APP_NAME}-v${APP_VERSION}.apk"
          ls -la

      # 额外一步：把 APK 作为 Actions 产物上传，即使 Release 那步出问题也能下载
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          # 原来 tag 是固定值，第二次运行会因为 tag 已存在而失败，这里带上构建号
          tag_name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: 小崔记账 v${{ env.APP_VERSION }}
          body: |
            小崔记账 Android APK（纯离线记账，不联网、不上传）
            构建号：${{ github.run_number }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

